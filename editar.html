<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Cita</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2 style="text-align: center; color: #f39c12;">Editar Datos de Consulta</h2>

    <div class="form-container" style="border-top: 5px solid #f39c12;">
        <form id="citaForm">
            <div class="form-group">
                <label>Fecha (Automática):</label>
                <input type="date" id="fecha" readonly style="background-color: #fdf5e6; color: #555; font-weight: bold;">
            </div>

            <div class="form-group" style="display: flex; gap: 15px;">
                <div style="flex: 1;">
                    <label>Hora Inicio:</label>
                    <input type="time" id="horaInicio" required>
                </div>
                <div style="flex: 1;">
                    <label>Hora Fin:</label>
                    <input type="time" id="horaFin" required>
                </div>
            </div>

            <div class="form-group">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" required>
            </div>

            <div class="form-group">
                <label for="carnet">Carnet de Identidad:</label>
                <input type="text" id="carnet" required>
            </div>

            <div class="form-group">
                <label for="edad">Edad:</label>
                <input type="number" id="edad" required min="1">
            </div>

            <div class="form-group">
                <label for="titulo">Motivo (Título):</label>
                <input type="text" id="titulo" required>
            </div>

            <div class="form-group">
                <label for="descripcion">Descripción Detallada:</label>
                <textarea id="descripcion" rows="4"></textarea>
            </div>

            <button type="submit" class="btn-save" style="background-color: #f39c12;">Guardar Cambios</button>
            <div class="text-center" style="margin-top: 15px;">
                <a href="index.html" class="btn-save btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const fechaParam = urlParams.get('fecha');
        const citas = JSON.parse(localStorage.getItem('citas')) || [];
        
        // Encontrar la cita original
        const citaOriginal = citas.find(c => new Date(c.start).getTime() === new Date(fechaParam).getTime());

        if (!citaOriginal) {
            alert("No se encontró la cita.");
            window.location.href = 'index.html';
        } else {
            // Llenar el formulario con los datos existentes
            const startObj = new Date(citaOriginal.start);
            const endObj = new Date(citaOriginal.end);
            const props = citaOriginal.extendedProps || {};

            document.getElementById('fecha').value = `${startObj.getFullYear()}-${String(startObj.getMonth() + 1).padStart(2, '0')}-${String(startObj.getDate()).padStart(2, '0')}`;
            document.getElementById('horaInicio').value = `${String(startObj.getHours()).padStart(2, '0')}:${String(startObj.getMinutes()).padStart(2, '0')}`;
            document.getElementById('horaFin').value = `${String(endObj.getHours()).padStart(2, '0')}:${String(endObj.getMinutes()).padStart(2, '0')}`;
            
            // Título original solía ser "Motivo - Nombre". Extraemos la primera parte.
            const motivo = citaOriginal.title.split(' - ')[0] || '';
            document.getElementById('titulo').value = motivo;
            
            document.getElementById('nombre').value = props.nombrePaciente || '';
            document.getElementById('carnet').value = props.carnet || '';
            document.getElementById('edad').value = props.edad || '';
            document.getElementById('descripcion').value = props.descripcion || '';
        }

        // Guardar cambios
        document.getElementById('citaForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // Eliminar la cita vieja
            const citasRestantes = citas.filter(c => new Date(c.start).getTime() !== new Date(citaOriginal.start).getTime());

            // Construir la nueva cita (Aquí deberías añadir la validación de horas si lo deseas, para mantenerlo simple ahora solo guardamos)
            const fecha = document.getElementById('fecha').value;
            const nuevaCita = {
                title: `${document.getElementById('titulo').value} - ${document.getElementById('nombre').value}`,
                start: new Date(`${fecha}T${document.getElementById('horaInicio').value}:00`).toISOString(),
                end: new Date(`${fecha}T${document.getElementById('horaFin').value}:00`).toISOString(),
                extendedProps: { nombrePaciente: document.getElementById('nombre').value, edad: document.getElementById('edad').value, carnet: document.getElementById('carnet').value, descripcion: document.getElementById('descripcion').value }
            };

            citasRestantes.push(nuevaCita);
            localStorage.setItem('citas', JSON.stringify(citasRestantes));
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Citas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2 style="text-align: center;">Próximas Citas</h2>
    
    <div class="text-center mb-20">
        <a href="index.html" class="btn-save btn-secondary">Volver al Calendario</a>
    </div>

    <div id="lista-citas" style="max-width: 600px; margin: 0 auto;">
        <!-- Aquí se insertarán las tarjetas con JS -->
    </div>

    <!-- Modal para ver detalles -->
    <div id="modalDetalle" class="modal-overlay">
        <div class="modal-content">
            <span class="close-modal" onclick="cerrarModal()">&times;</span>
            <h3 id="m-titulo"></h3>
            <p><strong>Fecha:</strong> <span id="m-fecha"></span></p>
            <p><strong>Paciente:</strong> <span id="m-paciente"></span></p>
            <p><strong>Edad:</strong> <span id="m-edad"></span></p>
            <p><strong>Carnet:</strong> <span id="m-carnet"></span></p>
            <hr>
            <p><strong>Descripción:</strong></p>
            <p id="m-descripcion" style="background: #f0f0f0; padding: 10px; border-radius: 4px;"></p>
            <br>
            <button onclick="cerrarModal()" class="btn-save">Cerrar</button>
        </div>
    </div>

    <script>
        // 1. Cargar citas
        const citas = JSON.parse(localStorage.getItem('citas')) || [];

        // 2. Ordenar citas por fecha (de la más antigua a la más nueva)
        citas.sort((a, b) => new Date(a.start) - new Date(b.start));

        const contenedor = document.getElementById('lista-citas');

        if (citas.length === 0) {
            contenedor.innerHTML = "<p style='text-align:center'>No hay citas agendadas.</p>";
        } else {
            citas.forEach((cita, index) => {
                // Formatear fecha para mostrarla bonita
                const fechaObj = new Date(cita.start);
                const fechaLegible = fechaObj.toLocaleString('es-ES', { 
                    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' 
                });

                // Crear tarjeta HTML
                const card = document.createElement('div');
                card.className = 'card';
                // Guardamos el índice en un atributo data para saber cual abrir
                card.setAttribute('onclick', `abrirModal(${index})`);
                
                card.innerHTML = `
                    <div class="card-date">📅 ${fechaLegible}</div>
                    <div class="card-title">${cita.title}</div>
                `;
                
                contenedor.appendChild(card);
            });
        }

        // --- Funciones del Modal ---

        function abrirModal(index) {
            const cita = citas[index];
            const props = cita.extendedProps || {}; // Por si acaso no tiene props

            // Llenar datos en el modal
            document.getElementById('m-titulo').innerText = cita.title;
            document.getElementById('m-fecha').innerText = new Date(cita.start).toLocaleString('es-ES');
            document.getElementById('m-paciente').innerText = props.nombrePaciente || 'No especificado';
            document.getElementById('m-edad').innerText = props.edad || 'No especificada';
            document.getElementById('m-carnet').innerText = props.carnet || 'No especificado';
            document.getElementById('m-descripcion').innerText = props.descripcion || 'Sin descripción adicional';

            // Mostrar modal (usamos flex para centrar)
            document.getElementById('modalDetalle').style.display = 'flex';
        }

        function cerrarModal() {
            document.getElementById('modalDetalle').style.display = 'none';
        }

        // Cerrar si se hace clic fuera del contenido del modal
        window.onclick = function(event) {
            const modal = document.getElementById('modalDetalle');
            if (event.target == modal) {
                cerrarModal();
            }
        }
    </script>
</body>
</html>

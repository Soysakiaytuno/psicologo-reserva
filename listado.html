<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Citas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2 style="text-align: center;">Próximas Citas</h2>
    
    <div class="text-center mb-20">
        <a href="index.html" class="btn-save btn-secondary">Volver al Calendario</a>
    </div>

    <div id="lista-citas" style="max-width: 600px; margin: 0 auto;">
        <!-- Aquí se insertarán las tarjetas con JS -->
    </div>

    <!-- Modal para ver detalles -->
    <div id="modalDetalle" class="modal-overlay">
        <div class="modal-content">
            <span class="close-modal" onclick="cerrarModal()">&times;</span>
            <h3 id="m-titulo"></h3>
            <p><strong>Fecha:</strong> <span id="m-fecha"></span></p>
            <p><strong>Paciente:</strong> <span id="m-paciente"></span></p>
            <p><strong>Edad:</strong> <span id="m-edad"></span></p>
            <p><strong>Carnet:</strong> <span id="m-carnet"></span></p>
            <hr>
            <p><strong>Descripción:</strong></p>
            <p id="m-descripcion" style="background: #f0f0f0; padding: 10px; border-radius: 4px;"></p>
            <br>
            <button onclick="cerrarModal()" class="btn-save">Cerrar</button>
        </div>
    </div>

    <!-- Importar el cliente de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Configuración de Supabase (REEMPLAZA CON TUS CREDENCIALES)
        const supabaseUrl = 'https://wftstfgqpulvvoisfdgm.supabase.co';
        const supabaseKey = 'sb_publishable_kFSYmTsR1V8YRnN4ny-2cA_W6VYnFbV';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        let citasGlobal = []; // Variable para que el modal acceda a los datos
        const contenedor = document.getElementById('lista-citas');

        async function cargarCitas() {
            // 1. Cargar citas ordenadas por fecha desde Supabase
            const { data: citas, error } = await supabaseClient
                .from('citas')
                .select('*')
                .order('start_time', { ascending: true });
                
            if (error) {
                contenedor.innerHTML = "<p style='text-align:center; color: red;'>Error al cargar las citas.</p>";
                console.error(error);
                return;
            }
            
            citasGlobal = citas;

            if (citas.length === 0) {
                contenedor.innerHTML = "<p style='text-align:center'>No hay citas agendadas.</p>";
            } else {
                citas.forEach((cita, index) => {
                    const fechaObj = new Date(cita.start_time);
                    const fechaLegible = fechaObj.toLocaleString('es-ES', { 
                        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' 
                    });

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.setAttribute('onclick', `abrirModal(${index})`);
                    card.innerHTML = `<div class="card-date">📅 ${fechaLegible}</div><div class="card-title">${cita.title}</div>`;
                    
                    contenedor.appendChild(card);
                });
            }
        }

        // Iniciar la carga
        cargarCitas();

        // --- Funciones del Modal ---

        function abrirModal(index) {
            const cita = citasGlobal[index];

            // Llenar datos en el modal
            document.getElementById('m-titulo').innerText = cita.title;
            document.getElementById('m-fecha').innerText = new Date(cita.start_time).toLocaleString('es-ES');
            document.getElementById('m-paciente').innerText = cita.paciente_nombre || 'No especificado';
            document.getElementById('m-edad').innerText = cita.paciente_edad || 'No especificada';
            document.getElementById('m-carnet').innerText = cita.paciente_carnet || 'No especificado';
            document.getElementById('m-descripcion').innerText = cita.descripcion || 'Sin descripción adicional';

            // Mostrar modal (usamos flex para centrar)
            document.getElementById('modalDetalle').style.display = 'flex';
        }

        function cerrarModal() {
            document.getElementById('modalDetalle').style.display = 'none';
        }

        // Cerrar si se hace clic fuera del contenido del modal
        window.onclick = function(event) {
            const modal = document.getElementById('modalDetalle');
            if (event.target == modal) {
                cerrarModal();
            }
        }
    </script>
</body>
</html>

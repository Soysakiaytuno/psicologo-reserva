<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Cita</title>
    <link rel="stylesheet" href="style.css">
    <!-- Importar Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <h2 style="text-align: center;">Datos del Paciente</h2>

    <div class="form-container">
        <form id="citaForm">
            <div class="form-group">
                <label>Fecha (Automática):</label>
                <input type="date" id="fecha" readonly style="background-color: #e0f2f1; color: #555; font-weight: bold;">
            </div>

            <div class="form-group" style="display: flex; gap: 15px;">
                <div style="flex: 1;">
                    <label>Hora Inicio:</label>
                    <input type="time" id="horaInicio" required>
                </div>
                <div style="flex: 1;">
                    <label>Hora Fin:</label>
                    <input type="time" id="horaFin" required>
                </div>
            </div>

            <div class="form-group">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" required placeholder="Ej: Juan Pérez">
            </div>

            <div class="form-group">
                <label for="carnet">Carnet de Identidad:</label>
                <input type="text" id="carnet" required placeholder="Ej: 1234567 SC">
            </div>

            <div class="form-group">
                <label for="edad">Edad:</label>
                <input type="number" id="edad" required placeholder="Ej: 35" min="1">
            </div>

            <div class="form-group">
                <label for="titulo">Motivo (Título):</label>
                <input type="text" id="titulo" required placeholder="Ej: Ansiedad, Consulta Inicial">
            </div>

            <div class="form-group">
                <label for="descripcion">Descripción Detallada:</label>
                <textarea id="descripcion" rows="4" placeholder="Detalles adicionales..."></textarea>
            </div>

            <button type="submit" class="btn-save">Agendar Cita</button>
            <div class="text-center" style="margin-top: 15px;">
                <a href="index.html" class="btn-save btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
    <script type="module" src="formulario.js"></script>
</body>
</html>
